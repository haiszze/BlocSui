<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BlocSui</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BlocSui: PrimeNG pass-through recipes that turn desktop dropdowns into mobile bottom sheets.">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('blocsui-theme');
        dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {}
      if (dark) document.documentElement.classList.add('primeng-mobile-adapter-dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
