<div class="flex min-h-dvh flex-col">
  <a
    href="#main"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-3 focus:z-50 focus:rounded-md focus:bg-ink focus:px-3 focus:py-2 focus:text-canvas"
    >Skip to content</a
  >

  <header class="sticky top-0 z-40 border-b border-line bg-canvas/85 backdrop-blur-md">
    <nav class="mx-auto flex h-14 max-w-6xl items-center gap-2 px-4 sm:gap-6 sm:px-6" aria-label="Primary">
      <a routerLink="/home" class="flex items-center gap-2 font-display text-[15px] font-semibold tracking-tight text-ink">
        <svg viewBox="0 0 64 64" class="size-6" aria-hidden="true">
          <rect width="64" height="64" rx="14" class="fill-ink" />
          <rect x="13" y="13" width="17" height="17" rx="4" class="fill-canvas" />
          <rect x="34" y="13" width="17" height="17" rx="4" class="fill-accent" />
          <rect x="13" y="34" width="38" height="17" rx="4" class="fill-canvas" />
        </svg>
        BlocSui
      </a>

      <ul class="flex items-center gap-0.5 text-sm">
        @for (doc of docs; track doc.slug) {
          <li>
            <a
              [routerLink]="'/' + doc.slug"
              routerLinkActive="text-ink! bg-surface-2"
              ariaCurrentWhenActive="page"
              class="rounded-md px-2.5 py-1.5 text-ink-soft transition-colors hover:text-ink"
              >{{ doc.title }}</a
            >
          </li>
        }
      </ul>

      <div class="ml-auto">
        <app-theme-toggle />
      </div>
    </nav>
  </header>

  <main id="main" class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-line">
    <div
      class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-8 text-sm text-ink-faint sm:flex-row sm:items-center sm:justify-between sm:px-6"
    >
      <p>BlocSui, adaptive blocks for PrimeNG. {{ year }}.</p>
      <p class="flex items-center gap-2">
        <img src="assets/icons/framework/angular.ico" alt="" class="size-4" />
        Angular 20
        <span aria-hidden="true">+</span>
        <img src="assets/icons/uilib/primeng.ico" alt="" class="size-4" />
        PrimeNG 20
      </p>
    </div>
  </footer>
</div>
