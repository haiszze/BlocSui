<figure class="flex flex-col gap-4">
  <div class="stage relative flex h-[360px] items-stretch justify-center overflow-hidden rounded-2xl border border-line bg-surface-2/60 p-4 sm:h-[400px] sm:p-6">
    <div
      class="frame relative flex min-w-[210px] flex-col overflow-hidden border border-line-strong bg-surface shadow-[0_18px_40px_-18px_rgb(0_0_0/0.35)]"
      [style.width]="frameWidth()"
      [class]="isPhone() ? 'rounded-[28px]' : 'rounded-xl'"
    >
      <!-- Chrome -->
      <div class="flex h-9 shrink-0 items-center gap-2 border-b border-line px-3">
        @if (isPhone()) {
          <span class="mx-auto h-1.5 w-14 rounded-full bg-line-strong" aria-hidden="true"></span>
        } @else {
          <span class="flex gap-1.5" aria-hidden="true">
            <span class="size-2.5 rounded-full bg-line-strong"></span>
            <span class="size-2.5 rounded-full bg-line-strong"></span>
            <span class="size-2.5 rounded-full bg-line-strong"></span>
          </span>
          <span class="ml-2 truncate rounded-md bg-surface-2 px-2 py-0.5 font-mono text-[10px] text-ink-faint">app.example.com/report</span>
        }
      </div>

      <!-- App content -->
      <div class="relative flex-1 p-4">
        <div class="mb-3 h-2.5 w-24 rounded bg-surface-2" aria-hidden="true"></div>
        <p class="mb-1.5 text-[11px] font-medium text-ink-soft">Document</p>
        <div class="relative max-w-[260px]">
          <div class="flex h-9 items-center justify-between rounded-md border border-accent px-3 text-xs text-ink-faint ring-2 ring-accent/20">
            Choose a document
            <i class="pi pi-chevron-down text-[10px]" aria-hidden="true"></i>
          </div>

          <!-- Desktop: dropdown -->
          <ul class="dropdown absolute inset-x-0 top-10 z-10 rounded-md border border-line bg-surface p-1 shadow-lg" [attr.data-hidden]="isPhone()">
            @for (o of options; track o; let first = $first) {
              <li class="rounded px-2.5 py-1.5 text-[11px] leading-snug text-ink" [class.bg-surface-2]="first">{{ o }}</li>
            }
          </ul>
        </div>

        <div class="mt-5 flex flex-col gap-2" aria-hidden="true">
          <div class="h-2 w-full rounded bg-surface-2"></div>
          <div class="h-2 w-5/6 rounded bg-surface-2"></div>
          <div class="h-2 w-2/3 rounded bg-surface-2"></div>
        </div>

        <!-- Phone: backdrop + bottom sheet -->
        <div class="backdrop absolute inset-0 bg-black/40" [attr.data-hidden]="!isPhone()" aria-hidden="true"></div>
        <div class="sheet absolute inset-x-0 bottom-0 z-20 flex flex-col rounded-t-2xl bg-surface" [attr.data-hidden]="!isPhone()">
          <span class="mx-auto mt-2 h-1 w-9 rounded-full bg-line-strong" aria-hidden="true"></span>
          <ul class="flex flex-col p-2">
            @for (o of options; track o; let first = $first) {
              <li class="rounded-md px-3 py-2 text-[11px] leading-snug text-ink" [class.bg-surface-2]="first">{{ o }}</li>
            }
          </ul>
          <p class="border-t border-line px-4 py-2.5 text-[11px] font-medium text-ink-soft">Cancel</p>
        </div>
      </div>
    </div>
  </div>

  <figcaption class="flex flex-col gap-2">
    <div class="flex items-center gap-3">
      <button type="button" (click)="jump('desktop')" class="text-ink-faint transition-colors hover:text-ink" aria-label="Desktop width">
        <i class="pi pi-desktop text-sm"></i>
      </button>
      <input
        type="range"
        min="0"
        max="100"
        step="1"
        class="handle flex-1"
        [value]="t()"
        [style.--fill]="t() + '%'"
        (input)="onInput($event)"
        aria-label="Simulated screen width"
        [attr.aria-valuetext]="px() + ' pixels, ' + (isPhone() ? 'bottom sheet' : 'dropdown')"
      />
      <button type="button" (click)="jump('phone')" class="text-ink-faint transition-colors hover:text-ink" aria-label="Phone width">
        <i class="pi pi-mobile text-sm"></i>
      </button>
    </div>
    <p class="flex justify-between font-mono text-xs text-ink-faint" aria-live="polite">
      <span>{{ px() }}px</span>
      <span [class.text-accent]="isPhone()">{{ isPhone() ? 'Bottom sheet' : 'Dropdown' }}</span>
    </p>
  </figcaption>
</figure>
