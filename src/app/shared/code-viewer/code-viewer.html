<figure class="code-block overflow-hidden rounded-xl border border-line bg-[var(--code-bg)]">
  <figcaption class="flex items-center gap-3 border-b border-line px-4 py-2.5">
    <i class="pi pi-file text-xs text-ink-faint" aria-hidden="true"></i>
    <span class="font-mono text-[13px] text-ink">{{ file() }}</span>
    @if (lines().length) {
      <span class="hidden whitespace-nowrap font-mono text-xs text-ink-faint sm:inline">{{ lines().length }} lines</span>
    }
    <div class="ml-auto flex items-center gap-1">
      <a
        [href]="url()"
        [attr.download]="file()"
        class="grid size-8 place-items-center rounded-md text-ink-faint transition-colors hover:bg-surface-2 hover:text-ink"
        [attr.aria-label]="'Download ' + file()"
        title="Download"
      >
        <i class="pi pi-download text-xs"></i>
      </a>
      <button
        type="button"
        (click)="copy()"
        [disabled]="!code()"
        class="flex h-8 items-center gap-1.5 rounded-md px-2.5 text-xs font-medium text-ink-soft transition-colors hover:bg-surface-2 hover:text-ink disabled:opacity-40"
      >
        <i class="pi text-xs" [class.pi-copy]="!copied()" [class.pi-check]="copied()" aria-hidden="true"></i>
        <span aria-live="polite">{{ copied() ? 'Copied' : 'Copy' }}</span>
      </button>
    </div>
  </figcaption>

  @if (failed()) {
    <p class="px-4 py-6 text-sm text-ink-soft">Could not load {{ file() }}.</p>
  } @else if (!code()) {
    <div class="flex flex-col gap-2 px-4 py-5" aria-hidden="true">
      @for (w of [72, 54, 88, 40, 64]; track $index) {
        <span class="h-3 animate-pulse rounded bg-surface-2" [style.width.%]="w"></span>
      }
    </div>
  } @else {
    <div class="relative">
      <div class="flex overflow-x-auto font-mono text-[12.5px] leading-[1.7]">
        <pre
          class="select-none border-r border-line px-3 py-4 text-right text-ink-faint/70"
          aria-hidden="true"
        >{{ lineNumbers() }}</pre>
        <pre class="flex-1 px-4 py-4 text-ink"><code [innerHTML]="highlighted()"></code></pre>
      </div>

      @if (collapsible()) {
        @if (!expanded()) {
          <div class="code-fade pointer-events-none absolute inset-x-0 bottom-0 h-24" aria-hidden="true"></div>
        }
        <div class="flex justify-center py-2" [class]="expanded() ? 'border-t border-line' : 'absolute inset-x-0 bottom-1'">
          <button
            type="button"
            (click)="expanded.set(!expanded())"
            [attr.aria-expanded]="expanded()"
            class="flex items-center gap-1.5 rounded-full border border-line bg-surface px-3 py-1.5 text-xs font-medium text-ink-soft shadow-sm transition-colors hover:text-ink"
          >
            <i class="pi text-[10px]" [class.pi-chevron-down]="!expanded()" [class.pi-chevron-up]="expanded()"></i>
            {{ expanded() ? 'Show less' : 'Show all ' + lines().length + ' lines' }}
          </button>
        </div>
      }
    </div>
  }
</figure>
